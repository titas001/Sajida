<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAJIDA Pay — prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{
  /* SAJIDA Foundation brand: yellow #F7CE19, sky blue #86CFDA, black #000000 (source: Brandfetch record of SAJIDA brand assets; confirm with SAJIDA Communications).
     Yellow and sky blue are surfaces only; text on them is always black. Deep sky #1F6F7C is a derived accessible tint for links and focus. */
  --brand-yellow:#F7CE19;--brand-sky:#86CFDA;--brand-black:#000000;--sky-deep:#1F6F7C;--chart-ink:#111111;--chart-fore:#1F6F7C;--frame:#000000;
  --g700:#000000;--g800:#000000;--g900:#000000;--g600:#1A1A1A;--g100:#E4F4F7;--g50:#F4FAFB;
  --surface:#FFFFFF;--surface2:#F1F5F6;--line:#DCE5E7;--ink:#111111;--ink2:#4A5558;--ink3:#69767A;
  --gold:#F7CE19;--gold50:#FFF8D9;--warn:#8A5300;--warn50:#FFF0D6;--danger:#B42318;--danger50:#FDECEA;--ok:#1E7B4F;--ok50:#E4F3EA;
  --page:#F3F7F8;--shadow:0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.08);
  --font:"Hind Siliguri","Noto Sans Bengali","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --surface:#15191A;--surface2:#1D2325;--line:#2E383B;--ink:#F2F4F5;--ink2:#B5C1C4;--ink3:#8D9A9E;--page:#0D1011;--g50:#141A1C;--g100:#1C2A2E;
  --gold50:#2E2810;--warn:#F0B566;--warn50:#33240F;--danger:#FF8F84;--danger50:#3A1A17;--ok:#5CC28E;--ok50:#15281E;--sky-deep:#86CFDA;--chart-ink:#E9EDEE;--chart-fore:#86CFDA;--frame:#2B3235;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--chart-ink:#E9EDEE;--chart-fore:#86CFDA;--frame:#2B3235;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);--surface:#15191A;--surface2:#1D2325;--line:#2E383B;--ink:#F2F4F5;--ink2:#B5C1C4;--ink3:#8D9A9E;--page:#0D1011;--g50:#141A1C;--g100:#1C2A2E;--gold50:#2E2810;--warn:#F0B566;--warn50:#33240F;--danger:#FF8F84;--danger50:#3A1A17;--ok:#5CC28E;--ok50:#15281E;--sky-deep:#86CFDA;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky-deep);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.num{font-variant-numeric:tabular-nums}

/* shell */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 20px;background:var(--g900);color:#fff}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:.2px}
.brand .mark{width:30px;height:30px;border-radius:9px;background:var(--brand-yellow);color:#000;display:grid;place-items:center;font-weight:800;font-size:17px}
.brand small{display:block;font-weight:400;font-size:11.5px;opacity:.75;line-height:1.1}
.top .sp{flex:1}
.top label{font-size:13px;opacity:.8}
.top select{background:#1A1A1A;border:1px solid #3A3A3A;color:#fff;border-radius:10px;padding:7px 10px;min-width:240px}
.seg{display:inline-flex;background:#1A1A1A;border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;color:#D6D6D6;padding:5px 11px;border-radius:8px;font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--brand-yellow);color:#000;font-weight:600}
.ghost{background:transparent;border:1px solid #3A3A3A;color:#E6E6E6;border-radius:10px;padding:6px 12px;font-size:13.5px}
.sample{font-size:12px;background:var(--brand-sky);color:#000;border-radius:999px;padding:2px 9px;font-weight:600}

/* app stage */
.stage{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:28px;max-width:1240px;margin:22px auto;padding:0 20px;align-items:start}
@media (max-width:900px){.stage{grid-template-columns:1fr}.phone{margin:0 auto}}
.phone{width:100%;max-width:390px;height:800px;max-height:calc(100vh - 110px);min-height:640px;background:var(--surface);border-radius:34px;border:10px solid var(--frame);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;position:relative}
.status{display:flex;justify-content:space-between;padding:6px 18px 2px;font-size:12px;color:var(--ink2)}
.appbar{display:flex;align-items:center;gap:10px;padding:8px 16px 10px}
.appbar h1{font-size:18px;margin:0;font-weight:700;flex:1}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.scroll{flex:1;overflow-y:auto;padding:0 16px 16px}
.nav{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--surface)}
.nav button{border:0;background:none;padding:8px 2px 10px;font-size:11.5px;color:var(--ink3);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="true"]{color:var(--ink);font-weight:700;box-shadow:inset 0 3px 0 var(--brand-yellow)}

.hello{display:flex;align-items:center;gap:12px;padding:4px 16px 12px}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--brand-sky);color:#000;display:grid;place-items:center;font-weight:700;flex:none}
.balance{background:#000;color:#fff;border:1px solid var(--frame);border-radius:20px;padding:16px 18px;position:relative;overflow:hidden}
.balance::after{content:"";position:absolute;right:-38px;top:-38px;width:104px;height:104px;border-radius:50%;background:var(--brand-yellow)}
.balance::before{content:"";position:absolute;right:62px;top:14px;width:22px;height:22px;border-radius:50%;background:var(--brand-sky)}
.balance>*{position:relative;z-index:1}
.balance .lbl{font-size:13px;opacity:.85}
.balance .amt{font-size:30px;font-weight:700;line-height:1.2}
.reveal{border:0;background:var(--brand-yellow);color:#000;font-weight:600;border-radius:999px;padding:6px 14px;font-size:14px;margin-top:4px}
.balance .row{display:flex;gap:18px;margin-top:12px;font-size:13px}
.balance .row b{display:block;font-size:15px}

/* the instalment ticket: the one bold element */
.ticket{margin:14px 0 4px;background:var(--gold50);border:2px solid var(--brand-yellow);border-radius:16px;display:grid;grid-template-columns:1fr auto;position:relative}
.ticket::before,.ticket::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:var(--surface);border:2px solid var(--brand-yellow);top:50%;transform:translateY(-50%)}
.ticket::before{left:-9px;clip-path:inset(0 0 0 50%)}.ticket::after{right:-9px;clip-path:inset(0 50% 0 0)}
.ticket .l{padding:12px 14px}.ticket .l small{color:var(--ink2);font-weight:600}
.ticket .l .a{font-size:24px;font-weight:700;color:var(--ink)}
.ticket .r{border-left:2px dashed var(--brand-yellow);display:grid;place-items:center;padding:0 14px}
.ticket.overdue{background:var(--warn50);border-color:var(--warn)}.ticket.overdue .l small{color:var(--warn)}

.grid6{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.act{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13.5px;font-weight:500;min-height:84px}
.act .ic{width:38px;height:38px;border-radius:12px;background:var(--g100);color:var(--ink);display:grid;place-items:center}
.act .ic svg{width:22px;height:22px}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
h2.sec{font-size:15px;margin:16px 0 8px;font-weight:700}
.tx{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:0}
.tx .ic{width:34px;height:34px;border-radius:10px;background:var(--g100);display:grid;place-items:center;flex:none;color:var(--ink)}
.tx .ic svg{width:18px;height:18px}
.tx .m{flex:1;min-width:0}.tx .m div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .m small{color:var(--ink3)}
.tx .v{font-weight:600}.cr{color:var(--ok)}.dr{color:var(--ink)}

.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.field label{font-size:13.5px;color:var(--ink2);font-weight:500}
.field input,.field select,.field textarea{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:16px;min-height:48px}
.field input:focus,.field select:focus{border-color:var(--sky-deep);outline:none}
.big{font-size:26px!important;font-weight:700}
.btn{border:0;background:var(--brand-yellow);color:#000;border-radius:14px;padding:13px 18px;font-size:16px;font-weight:600;min-height:50px;width:100%}
.btn.sec{background:var(--g100);color:var(--ink)}
.btn.warn{color:#fff}
.btn.warn{background:var(--danger)}
.btn.sm{width:auto;min-height:36px;padding:7px 14px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row2{display:flex;gap:10px}.row2>*{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.confirm dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:9px 12px}
.confirm dt{color:var(--ink2)}.confirm dd{margin:0;text-align:right;font-weight:600}
.confirm .tot{border-top:1px dashed var(--line);padding-top:9px}
.err{background:var(--danger50);color:var(--danger);border-radius:12px;padding:10px 12px;margin:10px 0;font-weight:500}
.info{background:var(--g50);border:1px solid var(--line);color:var(--ink2);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:13.5px}
.verified{color:var(--ok);font-weight:600;font-size:13px}
.pin{display:flex;justify-content:center;gap:14px;margin:22px 0 8px}
.pin i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink)}
.pin i.f{background:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.pad button{border:0;background:var(--surface2);border-radius:14px;font-size:24px;font-weight:600;min-height:56px}
.done{text-align:center;padding:20px 0}
.done .tick{width:72px;height:72px;border-radius:50%;background:var(--brand-yellow);color:#000;display:grid;place-items:center;margin:8px auto 12px;animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.done .tick svg{width:38px;height:38px}
.done h3{margin:4px 0;font-size:20px}
.progress{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}.progress span{display:block;height:100%;background:var(--chart-ink)}
.badge{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;background:var(--ok50);color:var(--ok)}
.badge.warn{background:var(--warn50);color:var(--warn)}.badge.bad{background:var(--danger50);color:var(--danger)}.badge.gold{background:var(--brand-yellow);color:#000}.badge.grey{background:var(--surface2);color:var(--ink2)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#000;color:#fff;padding:10px 16px;border-radius:12px;z-index:50;box-shadow:var(--shadow);max-width:90vw}

/* side panel */
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.panel h3{margin:0 0 10px;font-size:15px}
.panel p{margin:0 0 8px;color:var(--ink2);font-size:14px}
.jr{border-top:1px solid var(--line);padding:9px 0;font-size:13px}
.jr .h{display:flex;justify-content:space-between;gap:8px}
.jr table{width:100%;border-collapse:collapse;margin-top:4px}
.jr td{padding:1px 4px;color:var(--ink2)}.jr td.n{text-align:right;font-variant-numeric:tabular-nums}
.inv{display:flex;align-items:center;gap:8px;font-weight:600;padding:8px 12px;border-radius:12px;background:var(--g50);border:1px solid var(--line);font-size:14px;flex-wrap:wrap}
.inv.bad{background:var(--danger50);color:var(--danger)}
.ctrls{display:flex;flex-wrap:wrap;gap:8px}

/* USSD */
.feature{margin:6px auto;width:250px;background:#2b2b2b;border-radius:28px;padding:18px 16px 22px}
.feature .scr{background:#B9C9A6;color:#1d2a12;font-family:"Courier New",monospace;font-size:13px;border-radius:6px;padding:10px;min-height:170px;white-space:pre-wrap}
.feature input{width:100%;margin-top:8px;border-radius:6px;border:0;padding:8px;font-family:monospace}
.feature .k{display:flex;gap:6px;margin-top:8px}.feature .k button{flex:1;border:0;border-radius:6px;padding:7px;background:#4a4a4a;color:#fff}

/* web console */
.web{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - 58px);background:linear-gradient(to right,#000 232px,transparent 232px)}
@media (max-width:860px){.web{grid-template-columns:1fr;background:none}.sidebar{position:static!important;height:auto!important;display:flex;overflow-x:auto;padding:8px!important}.sidebar .who{display:none}.sidebar button{white-space:nowrap}}
.sidebar{background:#000;color:#D9D9D9;padding:16px 10px;position:sticky;top:58px;height:calc(100vh - 58px);overflow-y:auto}
.sidebar .who{padding:4px 10px 14px;border-bottom:1px solid #2A2A2A;margin-bottom:10px}
.sidebar .who b{display:block;color:#fff}
.sidebar .who small{opacity:.75}
.sidebar button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:inherit;text-align:left;padding:9px 12px;border-radius:10px;font-size:14.5px}
.sidebar button svg{width:18px;height:18px;opacity:.85}
.sidebar button[aria-current="true"]{background:#1C1C1C;color:#fff;font-weight:600;box-shadow:inset 3px 0 0 var(--brand-yellow)}
.sidebar .cnt{margin-left:auto;background:var(--brand-yellow);color:#000;border-radius:99px;font-size:11.5px;padding:0 7px;font-weight:700}
.main{padding:22px 26px 40px;min-width:0;max-width:1200px}
.main h1{font-size:24px;margin:0 0 4px}
.main .lead{color:var(--ink2);margin:0 0 18px;max-width:75ch}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.filters select,.filters input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px;min-height:38px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi .v{font-size:26px;font-weight:700;line-height:1.25}
.kpi .l{color:var(--ink2);font-size:13px}
.kpi .s{font-size:12.5px;color:var(--ink3)}
.kpi.alert .v{color:var(--danger)}
.cols{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
@media (max-width:1100px){.cols{grid-template-columns:1fr}}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0;margin-bottom:16px}
.box h2{font-size:16px;margin:0 0 2px}
.box .sub{color:var(--ink3);font-size:13px;margin:0 0 12px}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-weight:600;color:var(--ink2);font-size:12.5px;padding:8px 10px;border-bottom:1.5px solid var(--line);white-space:nowrap}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
table.t tr:hover td{background:var(--g50)}
.sev-High{color:var(--danger);font-weight:700}.sev-Medium{color:var(--warn);font-weight:700}.sev-Low{color:var(--ink2);font-weight:600}
.chart text{fill:var(--ink3);font-size:11px;font-family:var(--font)}
.chart .grid{stroke:var(--line)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--ink2);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.ask{display:flex;gap:8px}.ask input{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);min-height:44px}
pre.code{background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:12.5px;overflow-x:auto;white-space:pre-wrap;margin:8px 0}
.qr{width:150px;height:150px;display:block;border-radius:10px;background:#fff;padding:8px}
.modal{position:fixed;inset:0;background:rgba(10,25,20,.45);display:grid;place-items:center;z-index:60;padding:20px}
.modal .card{max-width:560px;width:100%;max-height:85vh;overflow:auto}
.muted{color:var(--ink3)}
.right{text-align:right}
.mt{margin-top:12px}
.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media print{.top,.sidebar,.side,.nav,.appbar{display:none!important}.modal{position:static;background:none}}

/* demo tour */
.tourbtn{border:0;background:var(--brand-yellow);color:#000;border-radius:10px;padding:7px 14px;font-weight:700;font-size:14px}
.tour{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:min(400px,calc(100vw - 36px));max-height:min(62vh,560px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 40px rgba(15,46,37,.28);z-index:40;overflow:hidden}
.tour .th{display:flex;justify-content:space-between;align-items:center;background:#000;color:#fff;padding:8px 10px 8px 14px;font-size:13px}
.tour .th button{border:0;background:#2A2A2A;color:#fff;border-radius:7px;min-width:30px;height:28px;padding:0 8px;font-size:13px}
.tour .tb{padding:12px 16px;overflow-y:auto}
.tour h3{margin:0 0 8px;font-size:18px}
.tour p{margin:0 0 9px;font-size:14px;line-height:1.5}
.tour .say{font-size:15px;border-left:4px solid var(--brand-yellow);padding-left:10px;color:var(--ink)}
.tour .tf{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.tour .dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}.tour .dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.tour .dots i.on{background:var(--ink)}
.tourpill{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;border:0;background:#000;color:#fff;border-radius:999px;padding:10px 16px;font-weight:600;box-shadow:var(--shadow)}
.pulse{outline:3px solid var(--sky-deep)!important;outline-offset:3px;animation:pulse 1.4s ease-in-out 3}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(247,206,25,.85)}50%{box-shadow:0 0 0 12px rgba(247,206,25,0)}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
@media print{.tour,.tourpill{display:none!important}}
.tour ~ .toast{left:calc(50% - 210px)}
@media (max-width:700px){.tour ~ .toast{left:50%;bottom:auto;top:80px}}

.balance{box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}

/* theme switch */
.themeseg button{font-size:13px}
.themeseg svg{width:15px;height:15px;vertical-align:-3px}
.chip svg{width:15px;height:15px;vertical-align:-3px}
@media (max-width:1560px){.themeseg .tl{display:none}.themeseg button{padding:5px 9px}}
.top select{max-width:340px;text-overflow:ellipsis}
.ticket .muted{color:var(--ink2)!important}
.btn.warn{background:#B42318}
@media (max-width:1420px){.top label[for="role"]{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}.top select{max-width:270px;min-width:200px}.brand small{display:none}}

/* SAJIDA logo: supplied white; on light surfaces it is shown as solid black (brightness 0), in dark theme as supplied */
.logo-adapt{filter:brightness(0)}
:root[data-theme="dark"] .logo-adapt{filter:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo-adapt{filter:none}}

<body>
<div id="root"><p style="padding:40px;font-family:sans-serif">Loading SAJIDA Pay sample data…</p></div>
<script>
/* SAJIDA Pay — core engine (prototype). Pure logic, no DOM.
   Money is stored as integer poisha (1 BDT = 100 poisha).
   Every account except ESCROW is an e-money liability; the invariant is
   ESCROW balance = sum of all e-money balances. */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.SPEngine = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const P = (bdt) => Math.round(bdt * 100);
  const DAY = 86400000;
  const dhakaDate = (ts) => new Date(ts + 6 * 3600000).toISOString().slice(0, 10);
  const dhakaMonth = (ts) => dhakaDate(ts).slice(0, 7);

  function hash(str) { // cyrb53, enough for a tamper-evident demo chain
    let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for (let i = 0; i < str.length; i++) {
      const ch = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16).padStart(14, '0');
  }

  const ERR = {
    INSUFFICIENT: ['Not enough balance for this payment.', 'এই লেনদেনের জন্য যথেষ্ট ব্যালেন্স নেই।'],
    LIMIT_DAILY: ['This is over your daily limit. You can send up to BDT {left} more today.', 'এটি আপনার দৈনিক সীমার বেশি। আজ আর সর্বোচ্চ {left} টাকা পাঠাতে পারবেন।'],
    LIMIT_COUNT: ['You have reached today\'s number of transactions. Try again tomorrow.', 'আজকের লেনদেনের সংখ্যা শেষ। আগামীকাল আবার চেষ্টা করুন।'],
    LIMIT_MONTHLY: ['This is over your monthly limit.', 'এটি আপনার মাসিক সীমার বেশি।'],
    BALANCE_CAP: ['The receiving wallet would go over its balance limit.', 'প্রাপকের ওয়ালেটের ব্যালেন্স সীমা ছাড়িয়ে যাবে।'],
    WRONG_PIN: ['Wrong PIN. {n} tries left.', 'ভুল পিন। আর {n} বার চেষ্টা করা যাবে।'],
    PIN_LOCKED: ['Too many wrong PINs. Try again after 30 minutes.', 'অনেকবার ভুল পিন। ৩০ মিনিট পর আবার চেষ্টা করুন।'],
    WALLET_FROZEN: ['This wallet is on hold. Call SAJIDA Pay support on 16XXX.', 'এই ওয়ালেটটি সাময়িক বন্ধ। সাজিদা পে সাপোর্টে কল করুন: ১৬XXX।'],
    NO_RECIPIENT: ['No SAJIDA Pay wallet is linked to this number. Check the number.', 'এই নম্বরে কোনো সাজিদা পে ওয়ালেট নেই। নম্বরটি আবার দেখুন।'],
    SELF: ['You cannot send money to your own number.', 'নিজের নম্বরে টাকা পাঠানো যাবে না।'],
    BAD_AMOUNT: ['Enter an amount greater than zero.', 'শূন্যের বেশি টাকার পরিমাণ লিখুন।'],
    OVERPAY: ['This is more than the loan outstanding of BDT {out}.', 'এটি ঋণের বকেয়া {out} টাকার চেয়ে বেশি।'],
    BLOCKED_FRAUD: ['Payment stopped for your safety. Your branch will call you.', 'আপনার নিরাপত্তার জন্য লেনদেনটি থামানো হয়েছে। শাখা থেকে আপনাকে ফোন করা হবে।'],
    HELD_FRAUD: ['Payment is on hold for a safety check. You will get an SMS.', 'নিরাপত্তা যাচাইয়ের জন্য লেনদেনটি স্থগিত। আপনাকে এসএমএস পাঠানো হবে।'],
    AGENT_FLOAT: ['The agent does not have enough float. Ask the agent to top up.', 'এজেন্টের যথেষ্ট ফ্লোট নেই। এজেন্টকে টপ-আপ করতে বলুন।'],
    MAKER_CHECKER: ['The approver must be a different person from the requester.', 'অনুমোদনকারী ও আবেদনকারী একই ব্যক্তি হতে পারবেন না।'],
    NOT_FOUND: ['Record not found.', 'তথ্য পাওয়া যায়নি।'],
    KYC_TIER: ['Complete e-KYC to use this service.', 'এই সেবা পেতে ই-কেওয়াইসি সম্পন্ন করুন।'],
    SAVINGS_LOCKED: ['Mandatory savings cannot be withdrawn while a loan is running.', 'ঋণ চলাকালীন বাধ্যতামূলক সঞ্চয় তোলা যাবে না।'],
    TIMEOUT: ['The bank did not respond. Your money is back in your wallet.', 'ব্যাংক সাড়া দেয়নি। টাকা আপনার ওয়ালেটে ফেরত এসেছে।'],
    NEEDS_AREA: ['Loans above BDT 5 lakh also need Area Manager approval.', '৫ লাখ টাকার বেশি ঋণে এরিয়া ম্যানেজারের অনুমোদনও লাগবে।'],
    BAD_PRODUCT: ['Amount is outside this loan product\'s range.', 'এই ঋণ পণ্যের সীমার বাইরে।'],
    DONE: ['This request was already processed.', 'এই অনুরোধটি আগেই সম্পন্ন হয়েছে।'],
    TIER_CAP_DEBIT: ['Your account level does not allow payments yet.', 'আপনার অ্যাকাউন্ট স্তরে এখনো পেমেন্ট করা যায় না।'],
    RATE_CAP: ['This product\'s effective rate is above the regulatory ceiling.', 'এই পণ্যের কার্যকর হার নিয়ন্ত্রক সীমার বেশি।'],
    OFFER_EXPIRED: ['This loan offer has expired. Ask your field officer for a new one.', 'এই ঋণ প্রস্তাবের মেয়াদ শেষ। মাঠকর্মীর কাছে নতুন প্রস্তাব চান।'],
    NO_CONSENT: ['Allow SAJIDA to use your wallet history first.', 'আগে সাজিদাকে আপনার ওয়ালেটের ইতিহাস ব্যবহারের অনুমতি দিন।'],
    NOT_ELIGIBLE: ['You are not eligible for a small loan yet. Keep paying on time and using your wallet.', 'আপনি এখনো ছোট ঋণের যোগ্য নন। নিয়মিত কিস্তি দিন ও ওয়ালেট ব্যবহার করুন।'],
    OVER_LIMIT: ['This is more than your available limit.', 'এটি আপনার সীমার চেয়ে বেশি।']
  };
  function fail(code, vars) {
    const f = (s) => s.replace(/\{(\w+)\}/g, (_, k) => (vars && vars[k] !== undefined ? vars[k] : ''));
    return { ok: false, error: { code, en: f(ERR[code][0]), bn: f(ERR[code][1]) } };
  }

  const PRODUCTS = {
    JAGORON: { name: 'Jagoron', division: 'Suchona', min: P(20000), max: P(500000), months: 12, freq: 'weekly', n: 46 },
    PRAGROSOR: { name: 'Pragrosor', division: 'Suchona', min: P(75000), max: P(500000), months: 12, freq: 'weekly', n: 46 },
    AGROSOR: { name: 'Agrosor', division: 'Biborton', min: P(100000), max: P(1000000), months: 18, freq: 'monthly', n: 18 },
    MIGRATION: { name: 'Migration Welfare', division: 'Biborton', min: P(100000), max: P(1000000), months: 18, freq: 'monthly', n: 18 },
    REMITTANCE: { name: 'Remittance', division: 'Biborton', min: P(100000), max: P(1000000), months: 18, freq: 'monthly', n: 18 },
    UTTORON: { name: 'Uttoron', division: 'Biborton', min: P(100000), max: P(1000000), months: 18, freq: 'monthly', n: 18 },
    SHOPNO: { name: 'Shopno', division: 'Biborton', min: P(100000), max: P(1000000), months: 18, freq: 'monthly', n: 18 },
    NANO: { name: 'Nano-loan', division: 'Nano', min: P(2000), max: P(20000), months: 3, freq: 'weekly', n: 12 }
  };
  const SCHEMES = {
    MANDATORY: { name: 'Mandatory Savings', rate: 0.06, min: P(200) },
    SAMRIDDHI: { name: 'Samriddhi', rate: 0.07, min: P(200), max: P(10000) },
    ASTHA3: { name: 'Astha 3.0', rate: 0.075, min: P(200) },
    ASTHA5: { name: 'Astha 5.0', rate: 0.09, min: P(200) },
    ASTHA7: { name: 'Astha 7.0', rate: 0.06, min: P(5000) }
  };

  function defaultConfig() {
    return {
      version: 1,
      tiers: {
        0: { cap: 0, daily: 0, count: 0, monthly: 0 },
        1: { cap: P(50000), daily: P(10000), count: 5, monthly: P(100000) },
        2: { cap: P(300000), daily: P(30000), count: 10, monthly: P(300000) }
      },
      fees: {
        p2p: { freeMonthly: P(25000), flat: P(5) },
        cashout: { rate: 0.015, min: P(5), max: P(1000) },
        merchant: { rate: 0.01 },
        npsb: { flat: P(10) }
      },
      split: { agent: 0.6, distributor: 0.1, platform: 0.3 },
      fraud: { simWindowH: 72, simCashout: P(10000), velocityCount: 5, velocityWindowMin: 10, agentSpikeX: 3, pinTries: 3, lockMin: 30 },
      loan: { flatRateWeekly: 0.11, flatRateMonthly: 0.125, maxEffective: 0.24, areaApprovalAbove: P(500000), walletDisburseMax: P(100000), requireAcceptance: true, offerDays: 7 },
      remitIncentive: 0.025,
      lowFloat: P(10000)
    };
  }

  // plain-text formula: fee = max(min, amount x rate), capped at max
  function pctFee(amount, rule) {
    let f = Math.round(amount * rule.rate);
    if (rule.min) f = Math.max(rule.min, f);
    if (rule.max) f = Math.min(rule.max, f);
    return f;
  }

  function createEngine(opts) {
    opts = opts || {};
    let nowTs = opts.now || Date.now();
    const S = {
      cfg: defaultConfig(), accounts: {}, journals: [], byAcct: {}, idem: {},
      members: {}, phones: {}, agents: {}, distributors: {}, merchants: {}, billers: {},
      loans: {}, collections: [], savings: {}, requests: [], alerts: [], audit: [],
      pendingConfig: [], notifications: [], tickets: [], seq: { J: 0, L: 0, R: 0, A: 0, C: 0, T: 0, N: 0 }
    };
    const now = () => nowTs;
    const id = (k) => k + String(++S.seq[k]).padStart(6, '0');

    // ---------- accounts & posting ----------
    function openAccount(acct, kind, meta) {
      if (!S.accounts[acct]) {
        S.accounts[acct] = Object.assign({ id: acct, kind, normal: acct === 'ESCROW' ? 'dr' : 'cr', bal: 0 }, meta || {});
        S.byAcct[acct] = [];
      }
      return S.accounts[acct];
    }
    ['ESCROW', 'FEE_INCOME', 'COMM_PAYABLE', 'LENDER_REPAY', 'SAVINGS_POOL', 'NPSB_CLR', 'SUSPENSE'].forEach((a) => openAccount(a, 'system'));

    function post(type, entries, meta) {
      let dr = 0, cr = 0; const delta = {};
      for (const e of entries) {
        if (!S.accounts[e.a]) throw new Error('Unknown account ' + e.a);
        if ((e.dr || 0) < 0 || (e.cr || 0) < 0 || !Number.isInteger(e.dr || 0) || !Number.isInteger(e.cr || 0)) throw new Error('Bad entry');
        dr += e.dr || 0; cr += e.cr || 0;
        const acc = S.accounts[e.a];
        const d = acc.normal === 'dr' ? (e.dr || 0) - (e.cr || 0) : (e.cr || 0) - (e.dr || 0);
        delta[e.a] = (delta[e.a] || 0) + d;
      }
      if (dr !== cr) throw new Error('Unbalanced journal ' + type);
      for (const a in delta) if (S.accounts[a].bal + delta[a] < 0) return null; // would go negative
      for (const a in delta) S.accounts[a].bal += delta[a];
      const prev = S.journals.length ? S.journals[S.journals.length - 1].hash : 'GENESIS';
      const j = { id: id('J'), ts: now(), type, entries: entries.map((e) => ({ a: e.a, dr: e.dr || 0, cr: e.cr || 0 })), meta: meta || {}, prev };
      j.hash = hash(prev + '|' + j.id + '|' + j.ts + '|' + type + '|' + JSON.stringify(j.entries));
      S.journals.push(j);
      const idx = S.journals.length - 1;
      for (const a in delta) S.byAcct[a].push(idx);
      return j;
    }
    const bal = (a) => (S.accounts[a] ? S.accounts[a].bal : 0);

    function audit(actor, action, detail) {
      const prev = S.audit.length ? S.audit[S.audit.length - 1].hash : 'GENESIS';
      const rec = { ts: now(), actor, action, detail: detail || {}, prev };
      rec.hash = hash(prev + '|' + rec.ts + '|' + actor + '|' + action + '|' + JSON.stringify(rec.detail));
      S.audit.push(rec); return rec;
    }

    function notify(to, en, bn, kind) {
      S.notifications.push({ id: id('N'), ts: now(), to, en, bn, kind: kind || 'info', read: false });
    }

    function idem(key, fn) {
      if (key && S.idem[key]) return Object.assign({}, S.idem[key], { replay: true });
      const r = fn();
      if (key && r.ok) S.idem[key] = r;
      return r;
    }

    // ---------- parties ----------
    function registerMember(m) {
      const mem = Object.assign({ tier: 2, status: 'active', pinTries: 0, lockedUntil: 0, simChangedAt: 0, devices: [], joined: now(), contacts: {} }, m);
      mem.pinHash = hash((m.pin || '12345') + mem.id); delete mem.pin;
      S.members[mem.id] = mem; S.phones[mem.phone] = { kind: 'member', id: mem.id };
      openAccount('W:' + mem.id, 'member', { owner: mem.id });
      Object.keys(SCHEMES).forEach((s) => { S.savings[mem.id + ':' + s] = { memberId: mem.id, scheme: s, bal: 0, history: [] }; });
      return mem;
    }
    function registerDistributor(d) { S.distributors[d.id] = Object.assign({ agents: [] }, d); openAccount('D:' + d.id, 'distributor', { owner: d.id }); return d; }
    function registerAgent(a) {
      const ag = Object.assign({ status: 'active', commissionPaid: 0, topups: [] }, a);
      ag.pinHash = hash((a.pin || '12345') + a.id); delete ag.pin;
      S.agents[ag.id] = ag; S.phones[ag.phone] = { kind: 'agent', id: ag.id };
      if (ag.distributorId && S.distributors[ag.distributorId]) S.distributors[ag.distributorId].agents.push(ag.id);
      openAccount('F:' + ag.id, 'agent', { owner: ag.id }); return ag;
    }
    function registerMerchant(m) { S.merchants[m.id] = Object.assign({ status: 'active' }, m); openAccount('M:' + m.id, 'merchant', { owner: m.id }); return m; }
    function registerBiller(b) { S.billers[b.id] = b; openAccount('B:' + b.id, 'biller', { owner: b.id }); return b; }

    // ---------- security ----------
    function verifyPin(kind, pid, pin) {
      const p = kind === 'agent' ? S.agents[pid] : S.members[pid];
      if (!p) return fail('NOT_FOUND');
      if (p.lockedUntil > now()) return fail('PIN_LOCKED');
      if (p.pinHash === hash(pin + pid)) { p.pinTries = 0; return { ok: true }; }
      p.pinTries = (p.pinTries || 0) + 1;
      if (p.pinTries >= S.cfg.fraud.pinTries) {
        p.lockedUntil = now() + S.cfg.fraud.lockMin * 60000; p.pinTries = 0;
        raiseAlert({ severity: 'Low', rule: 'PIN_LOCK', subject: pid, text: '3 wrong PINs, 30-minute lock applied', status: 'Locked' });
        return fail('PIN_LOCKED');
      }
      return fail('WRONG_PIN', { n: S.cfg.fraud.pinTries - p.pinTries });
    }
    function setPin(kind, pid, pin) { const p = kind === 'agent' ? S.agents[pid] : S.members[pid]; p.pinHash = hash(pin + pid); return { ok: true }; }

    function loginDevice(memberId, deviceId) {
      const m = S.members[memberId];
      if (m.devices.indexOf(deviceId) === -1) {
        if (m.devices.length) raiseAlert({ severity: 'Low', rule: 'NEW_DEVICE', subject: memberId, text: 'Login from a new device', status: 'OTP sent' });
        m.devices.push(deviceId); return { ok: true, otpRequired: m.devices.length > 1 };
      }
      return { ok: true, otpRequired: false };
    }
    function simChange(memberId) { S.members[memberId].simChangedAt = now(); audit('TELCO-FEED', 'SIM_CHANGE', { memberId }); }

    function raiseAlert(a) {
      const al = Object.assign({ id: id('A'), ts: now(), state: 'open' }, a);
      S.alerts.push(al); return al;
    }

    // ---------- limits ----------
    const LIMITED = { P2P: 1, CASH_OUT: 1, BILL: 1, MERCHANT: 1, NPSB_OUT: 1 };
    function usage(memberId) {
      const today = dhakaDate(now()), month = dhakaMonth(now());
      let day = 0, cnt = 0, mon = 0;
      const idxs = S.byAcct['W:' + memberId];
      for (let i = idxs.length - 1; i >= 0; i--) {
        const j = S.journals[idxs[i]];
        if (dhakaMonth(j.ts) !== month) break;
        if (!LIMITED[j.type] || j.meta.memberId !== memberId) continue;
        const amt = j.meta.amount || 0;
        mon += amt; if (dhakaDate(j.ts) === today) { day += amt; cnt++; }
      }
      return { day, cnt, mon };
    }
    function checkDebit(memberId, amount) {
      const m = S.members[memberId];
      if (!m) return fail('NOT_FOUND');
      if (m.status !== 'active') return fail('WALLET_FROZEN');
      if (!(amount > 0)) return fail('BAD_AMOUNT');
      const t = S.cfg.tiers[m.tier];
      if (!t || t.daily === 0) return fail('TIER_CAP_DEBIT');
      const u = usage(memberId);
      if (u.cnt + 1 > t.count) return fail('LIMIT_COUNT');
      if (u.day + amount > t.daily) return fail('LIMIT_DAILY', { left: Math.max(0, (t.daily - u.day) / 100).toLocaleString('en-IN') });
      if (u.mon + amount > t.monthly) return fail('LIMIT_MONTHLY');
      return { ok: true };
    }
    function checkCap(memberId, amount) {
      const m = S.members[memberId]; const t = S.cfg.tiers[m.tier];
      if (m.status !== 'active') return fail('WALLET_FROZEN');
      if (bal('W:' + memberId) + amount > t.cap) return fail('BALANCE_CAP');
      return { ok: true };
    }
    function p2pFee(memberId, amount) {
      const month = dhakaMonth(now()); let sent = 0;
      const idxs = S.byAcct['W:' + memberId];
      for (let i = idxs.length - 1; i >= 0; i--) {
        const j = S.journals[idxs[i]]; if (dhakaMonth(j.ts) !== month) break;
        if (j.type === 'P2P' && j.meta.memberId === memberId) sent += j.meta.amount;
      }
      return sent + amount > S.cfg.fees.p2p.freeMonthly ? S.cfg.fees.p2p.flat : 0;
    }

    // ---------- fraud ----------
    function fraudCheck(kind, memberId, amount, ctx) {
      const m = S.members[memberId]; const F = S.cfg.fraud;
      if (kind === 'CASH_OUT' && m.simChangedAt && now() - m.simChangedAt < F.simWindowH * 3600000 && amount > F.simCashout) {
        raiseAlert({ severity: 'High', rule: 'SIM_SWAP_CASHOUT', subject: memberId, amount, text: 'SIM changed, then BDT ' + (amount / 100).toLocaleString('en-IN') + ' cash-out attempt', status: 'Blocked' });
        notify(memberId, 'A cash-out was stopped for your safety. Your branch will call you.', 'আপনার নিরাপত্তার জন্য একটি ক্যাশ আউট থামানো হয়েছে।', 'alert');
        return 'block';
      }
      if (kind === 'P2P') {
        const m2 = S.members[ctx.toId]; const isNew = !m.contacts[ctx.toId];
        if (isNew) {
          const since = now() - F.velocityWindowMin * 60000; let c = 0;
          const idxs = S.byAcct['W:' + memberId];
          for (let i = idxs.length - 1; i >= 0; i--) { const j = S.journals[idxs[i]]; if (j.ts < since) break; if (j.type === 'P2P' && j.meta.memberId === memberId && j.meta.newRecipient) c++; }
          if (c + 1 > F.velocityCount) {
            raiseAlert({ severity: 'High', rule: 'VELOCITY_NEW_WALLETS', subject: memberId, amount, text: (c + 1) + ' transfers in ' + F.velocityWindowMin + ' minutes to new wallets', status: 'On hold', pending: { op: 'p2p', args: ctx.args } });
            return 'hold';
          }
        }
        void m2;
      }
      return 'allow';
    }
    function agentSpikeCheck(agentId) {
      const today = dhakaDate(now()); let t = 0; const byDay = {};
      const since = now() - 30 * DAY;
      for (const i of S.byAcct['F:' + agentId]) {
        const j = S.journals[i]; if (j.type !== 'CASH_OUT' || j.ts < since) continue;
        const d = dhakaDate(j.ts); if (d === today) t += j.meta.amount; else byDay[d] = (byDay[d] || 0) + j.meta.amount;
      }
      const days = Object.keys(byDay).length; if (days < 7) return; // need a baseline
      const avg = Object.values(byDay).reduce((a, b) => a + b, 0) / 30;
      if (t > S.cfg.fraud.agentSpikeX * avg && t >= P(20000) && !S.alerts.some((a) => a.rule === 'AGENT_SPIKE' && a.subject === agentId && dhakaDate(a.ts) === today)) {
        raiseAlert({ severity: 'Medium', rule: 'AGENT_SPIKE', subject: agentId, amount: t, text: 'Agent cash-out volume ' + (t / avg).toFixed(1) + 'x its normal level', status: 'Review' });
      }
    }

    // ---------- member money movement ----------
    function p2p(args, skipFraud) {
      return idem(args.key, () => {
        const from = args.memberId; const amount = args.amount;
        const to = S.phones[args.toPhone];
        if (!to || to.kind !== 'member') return fail('NO_RECIPIENT');
        if (to.id === from) return fail('SELF');
        if (args.pin !== undefined) { const v = verifyPin('member', from, args.pin); if (!v.ok) return v; }
        if (S.members[from].status !== 'active') return fail('WALLET_FROZEN');
        if (!(amount > 0)) return fail('BAD_AMOUNT');
        // fraud screening runs before limits so attack attempts are always seen
        if (!skipFraud) { const f = fraudCheck('P2P', from, amount, { toId: to.id, args: Object.assign({}, args, { pin: undefined, key: undefined }) }); if (f === 'hold') return fail('HELD_FRAUD'); }
        const c = checkDebit(from, amount); if (!c.ok) return c;
        const cap = checkCap(to.id, amount); if (!cap.ok) return cap;
        const fee = p2pFee(from, amount);
        const e = [{ a: 'W:' + from, dr: amount + fee }, { a: 'W:' + to.id, cr: amount }];
        if (fee) e.push({ a: 'FEE_INCOME', cr: fee });
        const m = S.members[from];
        const j = post('P2P', e, { memberId: from, toId: to.id, amount, fee, branchId: m.branchId, note: args.note || '', newRecipient: !m.contacts[to.id], channel: args.channel || 'app' });
        if (!j) return fail('INSUFFICIENT');
        m.contacts[to.id] = (m.contacts[to.id] || 0) + 1;
        notify(to.id, 'You received BDT ' + amount / 100 + ' from ' + m.name + '.', m.name + ' থেকে ' + amount / 100 + ' টাকা পেয়েছেন।', 'credit');
        return { ok: true, journal: j, fee };
      });
    }

    function cashIn(args) {
      return idem(args.key, () => {
        const ag = S.agents[args.agentId]; const to = S.phones[args.memberPhone];
        if (!ag) return fail('NOT_FOUND');
        if (!to || to.kind !== 'member') return fail('NO_RECIPIENT');
        if (!(args.amount > 0)) return fail('BAD_AMOUNT');
        const cap = checkCap(to.id, args.amount); if (!cap.ok) return cap;
        const j = post('CASH_IN', [{ a: 'F:' + ag.id, dr: args.amount }, { a: 'W:' + to.id, cr: args.amount }], { memberId: to.id, agentId: ag.id, amount: args.amount, branchId: ag.branchId });
        if (!j) return fail('AGENT_FLOAT');
        notify(to.id, 'Cash in BDT ' + args.amount / 100 + ' at ' + ag.name + '.', ag.name + ' থেকে ' + args.amount / 100 + ' টাকা ক্যাশ ইন হয়েছে।', 'credit');
        return { ok: true, journal: j };
      });
    }

    function cashOutQuote(amount) {
      const fee = pctFee(amount, S.cfg.fees.cashout); const s = S.cfg.split;
      const agent = Math.round(fee * s.agent), dist = Math.round(fee * s.distributor);
      return { fee, agent, dist, platform: fee - agent - dist };
    }
    function cashOut(args) {
      return idem(args.key, () => {
        const mid = args.memberId; const ag = S.agents[args.agentId] || (S.phones[args.agentPhone] && S.agents[S.phones[args.agentPhone].id]);
        if (!ag) return fail('NOT_FOUND');
        if (args.pin !== undefined) { const v = verifyPin('member', mid, args.pin); if (!v.ok) return v; }
        if (!S.members[mid] || S.members[mid].status !== 'active') return fail('WALLET_FROZEN');
        if (!(args.amount > 0)) return fail('BAD_AMOUNT');
        if (fraudCheck('CASH_OUT', mid, args.amount) === 'block') return fail('BLOCKED_FRAUD');
        const c = checkDebit(mid, args.amount); if (!c.ok) return c;
        const q = cashOutQuote(args.amount);
        const j = post('CASH_OUT', [
          { a: 'W:' + mid, dr: args.amount + q.fee }, { a: 'F:' + ag.id, cr: args.amount },
          { a: 'COMM_PAYABLE', cr: q.agent + q.dist }, { a: 'FEE_INCOME', cr: q.platform }
        ], { memberId: mid, agentId: ag.id, distributorId: ag.distributorId, amount: args.amount, fee: q.fee, commAgent: q.agent, commDist: q.dist, branchId: S.members[mid].branchId });
        if (!j) return fail('INSUFFICIENT');
        agentSpikeCheck(ag.id);
        return { ok: true, journal: j, fee: q.fee };
      });
    }

    function payBill(args) {
      return idem(args.key, () => {
        const b = S.billers[args.billerId]; if (!b) return fail('NOT_FOUND');

    function npsbOut(args) {
      return idem(args.key, () => {
        if (args.pin !== undefined) { const v = verifyPin('member', args.memberId, args.pin); if (!v.ok) return v; }
        const c = checkDebit(args.memberId, args.amount); if (!c.ok) return c;
        const fee = S.cfg.fees.npsb.flat;
        const meta = { memberId: args.memberId, amount: args.amount, fee, bank: args.bank, branchId: S.members[args.memberId].branchId };
        const j = post('NPSB_OUT', [{ a: 'W:' + args.memberId, dr: args.amount + fee }, { a: 'NPSB_CLR', cr: args.amount }, { a: 'FEE_INCOME', cr: fee }], meta);
        if (!j) return fail('INSUFFICIENT');

        }
        post('NPSB_SETTLE', [{ a: 'NPSB_CLR', dr: args.amount }, { a: 'ESCROW', cr: args.amount }], { ref: j.id, amount: args.amount });

    function addMoney(args) { // bank or bKash/Rocket into wallet: partner funds escrow
      return idem(args.key, () => {

    // ---------- float ----------
    function fundDistributor(distId, amount, by) {
      const j = post('FLOAT_ISSUE', [{ a: 'ESCROW', dr: amount }, { a: 'D:' + distId, cr: amount }], { distributorId: distId, amount });
      audit(by || 'SYSTEM', 'FLOAT_ISSUE', { distId, amount }); return { ok: true, journal: j };

    function requestTopup(agentId, amount) {

    function floatTransfer(distId, agentId, amount, reqId) {
      const j = post('FLOAT_TRANSFER', [{ a: 'D:' + distId, dr: amount }, { a: 'F:' + agentId, cr: amount }], { distributorId: distId, agentId, amount, branchId: S.agents[agentId].branchId });

    function payCommissions(user) { // pays accrued agent + distributor commission into their e-money accounts
      const acc = {};
      for (const j of S.journals) if (j.type === 'CASH_OUT' && !j.meta.commPaid) {
        acc['F:' + j.meta.agentId] = (acc['F:' + j.meta.agentId] || 0) + j.meta.commAgent;
        if (j.meta.distributorId) acc['D:' + j.meta.distributorId] = (acc['D:' + j.meta.distributorId] || 0) + j.meta.commDist;
        else acc['FEE_INCOME'] = (acc['FEE_INCOME'] || 0) + j.meta.commDist;
        j.meta.commPaid = true;
      }
      const total = Object.values(acc).reduce((a, b) => a + b, 0); if (!total) return { ok: true, total: 0 };
      const e = [{ a: 'COMM_PAYABLE', dr: total }].concat(Object.keys(acc).map((a) => ({ a, cr: acc[a] })));
      const j = post('COMMISSION_PAYOUT', e, { amount: total });
      audit(user || 'FINANCE', 'COMMISSION_PAYOUT', { total }); return { ok: true, journal: j, total };
    }

    // ---------- loans (MicroFin360 read model, mocked) ----------
    function buildSchedule(principal, product, startTs) {
      const pr = PRODUCTS[product]; const n = pr.n;
      const totalInt = Math.round(principal * flatRateOf(product) * (pr.months / 12) / 100) * 100;
      const pEach = Math.floor(principal / n / 100) * 100, iEach = Math.floor(totalInt / n / 100) * 100; // whole-taka instalments; last one absorbs rounding
      const sch = [];
      for (let k = 1; k <= n; k++) {
        const due = pr.freq === 'weekly' ? startTs + k * 7 * DAY : addMonths(startTs, k);
        sch.push({ n: k, due, principal: k === n ? principal - pEach * (n - 1) : pEach, interest: k === n ? totalInt - iEach * (n - 1) : iEach, paidP: 0, paidI: 0 });
      }
      return { sch, totalInt };
    }
    function flatRateOf(product) { return PRODUCTS[product].freq === 'weekly' ? S.cfg.loan.flatRateWeekly : S.cfg.loan.flatRateMonthly; }
    // Effective annual rate on a declining balance: IRR of the actual schedule x periods per year.
    function effectiveRate(principal, schedule, freq) {
      const flows = schedule.map((x) => x.principal + x.interest); let lo = 0, hi = 1;
      for (let k = 0; k < 100; k++) { const r = (lo + hi) / 2; let pv = 0; flows.forEach((f, i) => { pv += f / Math.pow(1 + r, i + 1); }); if (pv > principal) lo = r; else hi = r; }
      return ((lo + hi) / 2) * (freq === 'weekly' ? 52 : 12);
    }
    function keyFacts(product, amount, memberId) {
      const pr = PRODUCTS[product]; const { sch, totalInt } = buildSchedule(amount, product, now());
      const m = S.members[memberId]; const headroom = m ? Math.max(0, S.cfg.tiers[m.tier].cap - bal('W:' + m.id)) : amount;
      const toWallet = Math.min(amount, S.cfg.loan.walletDisburseMax, headroom);
      return { product, name: pr.name, amount, n: pr.n, freq: pr.freq, instalment: sch[0].principal + sch[0].interest, lastInstalment: sch[sch.length - 1].principal + sch[sch.length - 1].interest, totalInt, totalPayable: amount + totalInt, flatRate: flatRateOf(product), effective: effectiveRate(amount, sch, pr.freq), firstDue: sch[0].due, toWallet, toBank: amount - toWallet };
    }
    function addMonths(ts, k) { const d = new Date(ts); d.setUTCMonth(d.getUTCMonth() + k); return d.getTime(); }

    function requestDisbursement(args) {
      const pr = PRODUCTS[args.product]; const m = S.members[args.memberId];
      if (!pr || !m) return fail('NOT_FOUND');
      if (args.amount < pr.min || args.amount > pr.max) return fail('BAD_PRODUCT');
      if (keyFacts(args.product, args.amount, null).effective > S.cfg.loan.maxEffective + 1e-9) return fail('RATE_CAP');
      const r = { id: id('R'), kind: 'DISBURSE', memberId: m.id, product: args.product, amount: args.amount, maker: args.maker, ts: now(), state: 'pending', approvals: [], branchId: m.branchId, purpose: args.purpose || '' };
      S.requests.push(r); audit(args.maker, 'DISBURSE_REQUEST', { reqId: r.id, memberId: m.id, amount: args.amount });
      return { ok: true, request: r };
    }
    function approveDisbursement(reqId, checker, role) {
      const r = S.requests.find((x) => x.id === reqId); if (!r) return fail('NOT_FOUND');
      if (r.state !== 'pending') return fail('DONE');
      if (checker === r.maker || r.approvals.some((a) => a.by === checker)) return fail('MAKER_CHECKER');
      r.approvals.push({ by: checker, role, ts: now() });
      audit(checker, 'DISBURSE_APPROVE', { reqId, role });
      const needArea = r.amount > S.cfg.loan.areaApprovalAbove;
      const hasBM = r.approvals.some((a) => a.role === 'BM'), hasArea = r.approvals.some((a) => a.role === 'AREA');
      if (!hasBM) { r.waiting = 'BM'; return { ok: true, partial: true, waiting: 'BM' }; }
      if (needArea && !hasArea) { r.waiting = 'AREA'; return { ok: true, partial: true, waiting: 'AREA' }; }
      r.waiting = null;
      if (S.cfg.loan.requireAcceptance) {
        r.state = 'offered'; r.offerTs = now(); r.kfs = keyFacts(r.product, r.amount, r.memberId);
        notify(r.memberId, 'Your loan of BDT ' + r.amount / 100 + ' is approved. Open SAJIDA Pay to read and accept the offer.', 'আপনার ' + r.amount / 100 + ' টাকার ঋণ অনুমোদিত। সাজিদা পে খুলে প্রস্তাবটি পড়ুন ও গ্রহণ করুন।', 'credit');
        return { ok: true, offered: true, request: r };
      }
      return disburse(r);
    }
    function disburse(r) {
      const { sch, totalInt } = buildSchedule(r.amount, r.product, now());
      const loan = { id: id('L'), memberId: r.memberId, product: r.product, division: PRODUCTS[r.product].division, principal: r.amount, totalInt, schedule: sch, disbursedTs: now(), status: 'active', branchId: S.members[r.memberId].branchId };
      S.loans[loan.id] = loan;
      // Wallet gets at most the configured ceiling and the tier-cap headroom; the rest goes to the member's bank account
      // through NPSB (lender bank -> member bank, outside e-money), so a large loan never breaks wallet limits.
      const m = S.members[r.memberId]; const headroom = Math.max(0, S.cfg.tiers[m.tier].cap - bal('W:' + m.id));
      const toWallet = Math.min(r.amount, S.cfg.loan.walletDisburseMax, headroom); const toBank = r.amount - toWallet;
      const j = toWallet > 0 ? post('DISBURSE', [{ a: 'ESCROW', dr: toWallet }, { a: 'W:' + r.memberId, cr: toWallet }], { memberId: r.memberId, loanId: loan.id, product: r.product, amount: toWallet, loanAmount: r.amount, toBank, branchId: loan.branchId }) : null;
      loan.toWallet = toWallet; loan.toBank = toBank;
      r.state = 'disbursed'; r.loanId = loan.id;
      if (toBank) notify(r.memberId, 'Loan BDT ' + r.amount / 100 + ': BDT ' + toWallet / 100 + ' in your wallet, BDT ' + toBank / 100 + ' sent to your bank account.', 'ঋণ ' + r.amount / 100 + ' টাকা: ' + toWallet / 100 + ' টাকা ওয়ালেটে, ' + toBank / 100 + ' টাকা আপনার ব্যাংক হিসাবে।', 'credit');
      else notify(r.memberId, 'Loan BDT ' + r.amount / 100 + ' is in your wallet.', 'ঋণের ' + r.amount / 100 + ' টাকা আপনার ওয়ালেটে জমা হয়েছে।', 'credit');
      audit('LENDER', 'DISBURSE', { loanId: loan.id, toWallet, toBank });
      return { ok: true, loan, journal: j, toWallet, toBank };
    }
    function acceptOffer(args) {
      const r = S.requests.find((x) => x.id === args.reqId); if (!r || r.memberId !== args.memberId) return fail('NOT_FOUND');
      if (r.state !== 'offered') return fail('DONE');
      if (now() - r.offerTs > S.cfg.loan.offerDays * DAY) { r.state = 'expired'; return fail('OFFER_EXPIRED'); }
      if (args.pin !== undefined) { const v = verifyPin('member', args.memberId, args.pin); if (!v.ok) return v; }
      r.acceptedTs = now(); audit('SELF:' + args.memberId, 'OFFER_ACCEPT', { reqId: r.id, effective: r.kfs.effective });
      return disburse(r);
    }
    function declineOffer(reqId, memberId) {
      const r = S.requests.find((x) => x.id === reqId); if (!r || r.memberId !== memberId || r.state !== 'offered') return fail('NOT_FOUND');
      r.state = 'declined'; audit('SELF:' + memberId, 'OFFER_DECLINE', { reqId }); return { ok: true };
    }
    // Nano-loan eligibility: needs consent; score = 70 x on-time share of due instalments + 30 x wallet activity (active days in 90, capped at 30)
    function nanoEligibility(memberId) {
      const m = S.members[memberId]; if (!m.creditConsent) return { ok: false, error: fail('NO_CONSENT').error };
      let due = 0, late = 0;
      for (const l of Object.values(S.loans)) if (l.memberId === memberId) for (const x of l.schedule) if (x.due < now()) { due++; if (x.paidP + x.paidI < x.principal + x.interest) late++; }
      const days = new Set(); for (const i of S.byAcct['W:' + memberId]) { const j = S.journals[i]; if (j.ts > now() - 90 * DAY && j.meta.memberId === memberId && j.type !== 'DISBURSE') days.add(dhakaDate(j.ts)); }
      const onTime = due ? (due - late) / due : 0; const activity = Math.min(1, days.size / 30);
      const score = Math.round(70 * onTime + 30 * activity);
      const open = S.requests.some((r) => r.memberId === memberId && r.product === 'NANO' && ['pending', 'offered'].includes(r.state)) || Object.values(S.loans).some((l) => l.memberId === memberId && l.product === 'NANO' && l.status === 'active');
      const limit = late > 0 || open ? 0 : score >= 85 ? P(20000) : score >= 70 ? P(10000) : score >= 55 ? P(5000) : 0;
      return { ok: true, score, onTime, activeDays: days.size, dueCount: due, late, limit, open };
    }
    function requestNano(args) {
      const e = nanoEligibility(args.memberId); if (!e.ok) return { ok: false, error: e.error };
      if (!e.limit) return fail('NOT_ELIGIBLE');
      if (args.amount > e.limit) return fail('OVER_LIMIT');
      if (args.pin !== undefined) { const v = verifyPin('member', args.memberId, args.pin); if (!v.ok) return v; }
      return requestDisbursement({ memberId: args.memberId, product: 'NANO', amount: args.amount, maker: 'SELF:' + args.memberId, purpose: args.purpose || 'Nano-loan' });

        members.push(E.registerMember({ id, name: bIdx === 1 && k === 0 ? 'Jamal Hossain' : name, phone: '018' + String(10000000 + mi), nid: '19' + String(8800000000 + mi * 7919).slice(0, 11), branchId: b.id, groupId: null, division: 'Biborton', tier: 2, gender: female ? 'F' : 'M', village: b.name }));
      }
    });
    meta.rahima = 'M00001';
    meta.jamal = members.find((m) => m.name === 'Jamal Hossain').id;

    // historic loans (before the 90-day window)
    const borrowers = members.filter((m, i) => i === 0 || R() < (m.division === 'Suchona' ? 0.72 : 0.66));
    const overdueSet = new Set();
    borrowers.forEach((m) => {
      let product, amount;
      if (m.id === meta.rahima) { product = 'JAGORON'; amount = P(47000); }
      else if (m.division === 'Suchona') { product = R() < 0.75 ? 'JAGORON' : 'PRAGROSOR'; amount = product === 'JAGORON' ? P(20000 + Math.floor(R() * 12) * 5000) : P(75000 + Math.floor(R() * 8) * 10000); }
      else { product = pick(['AGROSOR', 'MIGRATION', 'REMITTANCE', 'UTTORON', 'SHOPNO']); amount = P(100000 + Math.floor(R() * 10) * 50000); }
      const back = m.id === meta.rahima ? 100 : 95 + Math.floor(R() * 200);
      E.setNow(start - back * DAY + 9 * 3600000);
      const r = E.requestDisbursement({ memberId: m.id, product, amount, maker: 'FO-SEED' });
      let d = E.approveDisbursement(r.request.id, 'BM-SEED', 'BM');
      if (d.partial) d = E.approveDisbursement(r.request.id, 'AM-SEED', 'AREA');
      // money leaves the wallet as cash at disbursement time (pre-wallet era)
      const loan = d.loan;
      E.post('CASH_OUT_LEGACY', [{ a: 'W:' + m.id, dr: amount }, { a: 'ESCROW', cr: amount }], { memberId: m.id, legacy: true });
      // pre-window instalments paid in cash
      for (const s of loan.schedule) if (s.due < start) { s.paidP = s.principal; s.paidI = s.interest; }
      if (loanSettled(E, loan)) loan.status = 'closed';
      if (m.id !== meta.rahima && R() < 0.035) overdueSet.add(loan.id);
    });

    // savings opening balances (pre-window, via branch cash)
    members.forEach((m) => {
      E.setNow(start - 5 * DAY);
      const base = m.id === meta.rahima ? P(6800) : P(500 + Math.floor(R() * 60) * 100);
      E.savingsDeposit({ memberId: m.id, scheme: 'MANDATORY', amount: base, channel: 'cash' });
      if (R() < 0.35) E.savingsDeposit({ memberId: m.id, scheme: 'SAMRIDDHI', amount: P(1000 + Math.floor(R() * 20) * 500), channel: 'cash' });
      if (R() < 0.08) E.savingsDeposit({ memberId: m.id, scheme: 'ASTHA5', amount: P(5000 + Math.floor(R() * 10) * 1000), channel: 'cash' });
      E.loginDevice(m.id, 'DEV-' + m.id);
    });

    // daily simulation over 90 days
    const loans = Object.values(E.S.loans);
    const merchants = Object.keys(E.S.merchants);
    const adopted = new Set([meta.rahima, meta.jamal]);
    for (let day = 0; day < 90; day++) {
      const d0 = start + day * DAY; const dow = new Date(d0 + 6 * 3600000).getUTCDay(); // 0 Sun
      const progress = day / 89; const adoptionRate = 0.28 + 0.42 * progress; // wallet adoption grows
      members.forEach((m) => { if (!adopted.has(m.id) && R() < adoptionRate * 0.02) adopted.add(m.id); });
      const at = (h) => E.setNow(d0 + Math.floor((h + R()) * 3600000) - 6 * 3600000);
      // instalments due today
      for (const loan of loans) {
        if (loan.status !== 'active') continue;
        for (const s of loan.schedule) {
          if (s.due < d0 || s.due >= d0 + DAY) continue;
          const left = s.principal - s.paidP + s.interest - s.paidI; if (left <= 0) continue;
          if (overdueSet.has(loan.id) && s.due > start + 40 * DAY) continue; // stopped paying
          if (R() < 0.03 && loan.memberId !== meta.rahima) continue; // occasional miss
          at(10);
          const isAdopted = adopted.has(loan.memberId);
          let ch = 'cash';
          if (isAdopted) ch = R() < 0.62 ? 'wallet' : 'agent'; else if (R() < 0.18 * progress) ch = 'agent';
          const ags = agentsByBranch[loan.branchId];
          if (ch === 'wallet' && E.bal('W:' + loan.memberId) < left) {
            const ag = pick(ags); if (E.bal('F:' + ag) < left + P(5000)) E.floatTransfer(E.S.agents[ag].distributorId, ag, P(100000));
            const ci = E.cashIn({ agentId: ag, memberPhone: E.S.members[loan.memberId].phone, amount: left + P(Math.floor(R() * 20) * 100) });
            if (!ci.ok) ch = 'cash';
          }
          if (ch === 'agent') { const ag = pick(ags); if (E.bal('F:' + ag) < left) E.floatTransfer(E.S.agents[ag].distributorId, ag, P(100000)); E.repay({ loanId: loan.id, amount: left, channel: 'agent', agentId: ag, by: ag }); }
          else E.repay({ loanId: loan.id, amount: left, channel: ch, by: ch === 'cash' ? 'FO' : null });
          if (R() < 0.5) E.savingsDeposit({ memberId: loan.memberId, scheme: 'MANDATORY', amount: P(50), channel: ch === 'wallet' ? 'wallet' : 'cash' });
        }
      }
      const vol = dow === 5 ? 60 : 140 + Math.floor(progress * 160) + (dow === 4 ? 40 : 0);
      for (let k = 0; k < vol; k++) dailyRetail(E, members, adopted, merchants, agentsByBranch, R, pick, at);
      // remittance (Biborton migration / remittance product families + some Suchona)
      for (let k = 0; k < 4 + Math.floor(progress * 6); k++) {
        const m = pick(members); if (!adopted.has(m.id) || m.id === 'M00001') continue; at(13);
        E.remittanceIn({ memberId: m.id, amount: P(10000 + Math.floor(R() * 40) * 1000), source: pick(['Malaysia', 'Saudi Arabia', 'UAE', 'Qatar', 'Oman']), partner: pick(['Western Union', 'Prime Bank Remit', 'BRAC Bank Remit']), key: 'RMT-' + day + '-' + k });
      }
      // new disbursements inside window go straight to wallets once adopted
      for (let k = 0; k < 3; k++) {
        const m = pick(members); if (m.id === 'M00001' || Object.values(E.S.loans).some((l) => l.memberId === m.id && l.status === 'active')) continue;
        at(11);
        const product = m.division === 'Suchona' ? 'JAGORON' : pick(['AGROSOR', 'SHOPNO', 'UTTORON']);
        const amount = m.division === 'Suchona' ? P(25000 + Math.floor(R() * 8) * 5000) : P(150000 + Math.floor(R() * 6) * 50000);
        const r = E.requestDisbursement({ memberId: m.id, product, amount, maker: 'FO-' + m.branchId });
        if (!r.ok) continue;
        let d = E.approveDisbursement(r.request.id, 'BM-' + m.branchId, 'BM');
        if (d.partial) d = E.approveDisbursement(r.request.id, 'AM-SEED', 'AREA');
        if (d.loan) { loans.push(d.loan); adopted.add(m.id); }
      }
      if (day % 7 === 6) { at(17); E.payCommissions('FIN-SEED'); }
    }

    // today so far: activity between Dhaka midnight and now
    const frac = Math.min(1, Math.max(0, (nowReal - today0) / DAY));
    const todayVol = Math.floor(300 * Math.max(0, frac - 0.3) / 0.7);
    for (let k = 0; k < todayVol; k++) dailyRetail(E, members, adopted, merchants, agentsByBranch, R, pick, () => E.setNow(today0 + Math.floor(R() * (nowReal - today0 - 3600000))));
    // today: set clock to real now; pending work for demo
    E.setNow(nowReal);
    meta.adopted = adopted;
    E.S.cfg.loan.requireAcceptance = true;
    members.forEach((m) => { if (m.id === meta.rahima || !adopted.has(m.id)) return; if (R() < 0.42) m.creditConsent = true; if (R() < 0.22 && Object.values(E.S.loans).some((l) => l.memberId === m.id && l.status === 'active')) m.autopay = true; });
    seedDemoState(E, meta, members, agentsByBranch, R, pick);
    return { E, meta };
  }

  function loanSettled(E, loan) { return E.loanOutstanding(loan.id).total === 0; }

  function dailyRetail(E, members, adopted, merchants, agentsByBranch, R, pick, at) {
    const m = pick(members); if (!adopted.has(m.id) || m.id === 'M00001') return;
    const r = R(); const ags = agentsByBranch[m.branchId];
    if (E.bal('W:' + m.id) < P(3000)) {
      at(9 + Math.floor(R() * 8)); const ag = pick(ags);
      if (E.bal('F:' + ag) < P(30000)) E.floatTransfer(E.S.agents[ag].distributorId, ag, P(100000));
      E.cashIn({ agentId: ag, memberPhone: m.phone, amount: P(1000 + Math.floor(R() * 30) * 200) });
      return;
    }
    at(8 + Math.floor(R() * 13));
    if (r < 0.32) { const to = pick(members); if (to.id !== m.id) E.p2p({ memberId: m.id, toPhone: to.phone, amount: P(200 + Math.floor(R() * 25) * 100) }); }
    else if (r < 0.52) { const b = pick(E.S.billers ? Object.keys(E.S.billers) : []); E.payBill({ memberId: m.id, billerId: b, account: String(10000000 + Math.floor(R() * 8999999)), amount: P(b === 'GP' || b === 'ROBI' || b === 'BL' ? 50 + Math.floor(R() * 10) * 20 : 300 + Math.floor(R() * 25) * 50) }); }
    else if (r < 0.75) { const mr = pick(merchants); E.payMerchant({ memberId: m.id, merchantId: mr, amount: P(80 + Math.floor(R() * 40) * 25) }); }
    else if (r < 0.92) { const ag = pick(agentsByBranch[m.branchId]); E.cashOut({ memberId: m.id, agentId: ag, amount: P(500 + Math.floor(R() * 20) * 250) }); }
    else E.savingsDeposit({ memberId: m.id, scheme: R() < 0.6 ? 'SAMRIDDHI' : 'MANDATORY', amount: P(200 + Math.floor(R() * 10) * 100) });
  }

  function seedDemoState(E, meta, members, agentsByBranch, R, pick) {
    const rahima = E.S.members[meta.rahima]; const tNow = E.now(); const at = (dAgo, h) => E.setNow(meta.today0 - dAgo * DAY + h * 3600000); // today0 is already Dhaka midnight
    // a believable recent week for Rahima, ending at BDT 12,450
    at(6, 11); E.remittanceIn({ memberId: rahima.id, amount: P(15000), source: 'Malaysia', partner: 'Prime Bank Remit', key: 'RMT-RAHIMA-1' });
    at(5, 18); E.payBill({ memberId: rahima.id, billerId: 'DESCO', account: '55012345', amount: P(860) });
    at(4, 10); E.p2p({ memberId: rahima.id, toPhone: E.S.members.M00002.phone, amount: P(500), note: 'Thread for orders' });
    at(3, 12); E.payMerchant({ memberId: rahima.id, merchantId: 'MR01', amount: P(340) });
    at(2, 9); { const d = E.bal('W:' + rahima.id) - P(100) - P(12450); if (d >= P(200)) E.savingsDeposit({ memberId: rahima.id, scheme: 'SAMRIDDHI', amount: Math.floor(d / P(100)) * P(100) }); }
    at(1, 19); { const r = E.bal('W:' + rahima.id) - P(12450); E.payBill({ memberId: rahima.id, billerId: 'GP', account: rahima.phone, amount: r >= P(50) && r <= P(300) ? r : P(100) }); }
    at(0, 9.5); const cur = E.bal('W:' + rahima.id); const target = P(12450);
    if (cur < target) E.cashIn({ agentId: 'AG001', memberPhone: rahima.phone, amount: target - cur });
    else if (cur > target) E.savingsDeposit({ memberId: rahima.id, scheme: 'SAMRIDDHI', amount: cur - target });
    E.setNow(tNow);
    // pending disbursement requests for the Branch Manager
    const savarMembers = members.filter((m) => m.branchId === 'BR01' && !Object.values(E.S.loans).some((l) => l.memberId === m.id && l.status === 'active'));
    savarMembers.slice(0, 3).forEach((m, i) => E.requestDisbursement({ memberId: m.id, product: m.division === 'Suchona' ? 'JAGORON' : 'SHOPNO', amount: m.division === 'Suchona' ? P([30000, 40000, 25000][i]) : P(600000), maker: 'FO-BR01-1', purpose: ['Tailoring machine', 'Poultry feed', 'Grocery stock'][i] }));
    // a self-requested nano-loan waiting for the Savar Branch Manager
    const nanoM = members.find((m) => { if (m.branchId !== 'BR01' || m.id === meta.rahima || !meta.adopted.has(m.id) || m.status !== 'active') return false; const had = m.creditConsent; m.creditConsent = true; const e = E.nanoEligibility(m.id); if (e.ok && e.limit >= P(5000)) return true; m.creditConsent = had; return false; });
    if (nanoM) E.requestNano({ memberId: nanoM.id, amount: P(5000), purpose: 'Thread and cloth for Eid orders' });
    // a top-up request from Karim Store; low float on another agent
    E.requestTopup('AG001', P(50000));
    const low = agentsByBranch.BR01[2]; const lb = E.bal('F:' + low);
    if (lb > P(8000)) E.post('FLOAT_RETURN', [{ a: 'F:' + low, dr: lb - P(8000) }, { a: 'D:' + E.S.agents[low].distributorId, cr: lb - P(8000) }], { agentId: low, amount: lb - P(8000) });
    // sample fraud alerts from earlier today
    const t = E.now();
    const victim = members.find((x, i) => i > 30 && x.tier === 2 && x.status === 'active');
    E.setNow(t - 50 * 60000); E.simChange(victim.id);
    E.setNow(t - 35 * 60000); E.cashOut({ memberId: victim.id, agentId: agentsByBranch[victim.branchId][1], amount: P(45000) });
    E.setNow(t - 20 * 60000); E.loginDevice(members[88].id, 'DEV-NEW-88');
    const spikeAg = agentsByBranch.BR05[0]; E.setNow(t - 15 * 60000);
    for (let k = 0; k < 6; k++) { const mm = members.filter((x) => x.branchId === 'BR05' && E.bal('W:' + x.id) > P(6000))[k]; if (mm) E.cashOut({ memberId: mm.id, agentId: spikeAg, amount: P(6000) }); }
    const mule = members[150]; E.setNow(t - 10 * 60000);
    E.cashIn({ agentId: agentsByBranch[mule.branchId][0], memberPhone: mule.phone, amount: P(6000) });
    for (let k = 0; k < 6; k++) E.p2p({ memberId: mule.id, toPhone: members[600 + k * 3].phone, amount: P(400) });
    E.setNow(t);
    // support tickets
    const tk = (memberId, cat, text, state, hAgo) => E.S.tickets.push({ id: 'TK' + (E.S.tickets.length + 1001), memberId, cat, text, state, ts: t - hAgo * 3600000, slaH: cat === 'Dispute' ? 24 : 48 });
    tk(members[12].id, 'Dispute', 'Sent BDT 2,000 to wrong number', 'Open', 30);
    tk(members[45].id, 'PIN reset', 'Forgot PIN after phone change', 'In progress', 5);
    tk(members[300].id, 'Agent complaint', 'Agent asked extra BDT 20 for cash-out', 'Escalated', 50);
    tk(members[410].id, 'Bill payment', 'DESCO token not received', 'Resolved', 70);
    tk(meta.rahima, 'Information', 'How to add Samriddhi savings', 'Closed', 120);
    // reconciliation external statements (ekPay with 3 exceptions)
    meta.today = E.dhakaDate(t - DAY);
  }

  return { build, BILLERS };
});

  if (u.s === 'sendTo') { u.to = v; u.s = 'sendAmt'; return; }
  if (u.s === 'sendAmt') { u.amt = P(+v || 0); u.next = 'send'; u.s = 'pin'; return; }
  if (u.s === 'pin') {
    const ok = E.verifyPin('member', mid, v);
    if (!ok.ok) { u.msg = ok.error.en; u.s = 'msg'; return; }
    if (u.next === 'bal') u.msg = 'Balance: ' + fmt(E.bal('W:' + mid));
    if (u.next === 'stmt') u.msg = 'Last 3:\n' + E.statement(mid, 3).map((x) => (x.delta > 0 ? '+' : '') + grp(x.delta / 100) + ' ' + x.j.type.replace('_', ' ')).join('\n');
    if (u.next === 'repay') { const st = E.loanStatus(l.id); const r = E.repay({ loanId: l.id, amount: st.overdueAmt || st.next.amount, channel: 'wallet', key: newKey() }); u.msg = r.ok ? 'Paid ' + fmt(r.journal.meta.amount) + '. Ref ' + r.journal.id : r.error.en; }
    if (u.next === 'send') { const r = E.p2p({ memberId: mid, toPhone: u.to, amount: u.amt, key: newKey(), channel: 'ussd' }); u.msg = r.ok ? 'Sent ' + fmt(u.amt) + ' to ' + memberName(E.S.phones[u.to].id) + '. Ref ' + r.journal.id : r.error.en; }
    u.s = 'msg';
  }
}

function sidePanel(accts, extra) {
  const E = W.E; const inv = E.checkInvariant();
  const seen = new Set(); const idx = [];
  accts.forEach((a) => (E.S.byAcct[a] || []).slice(-8).forEach((i) => { if (!seen.has(i)) { seen.add(i); idx.push(i); } }));
  idx.sort((a, b) => b - a);
  const nm = (a) => { const [k, id] = a.split(':'); if (!id) return a.replace('_', ' ').toLowerCase(); return ({ W: 'Wallet ', F: 'Agent float ', D: 'Distributor ', M: 'Merchant ', B: 'Biller ' }[k] || '') + (k === 'W' ? memberName(id) : k === 'F' ? E.S.agents[id].name : k === 'M' ? E.S.merchants[id].name : id); };
  return `<aside class="side" aria-label="Behind the scenes">
    <div class="panel"><h3>Behind the screen: the ledger</h3><p>Every tap above posts a double-entry journal. The platform must always hold as much in the escrow bank as it owes in e-money.</p>
    <div class="inv ${inv.ok ? '' : 'bad'}" data-testid="invariant">${inv.ok ? '✓' : '✗'} Escrow BDT ${tk(inv.escrow, { web: 1, bare: 1 })} ${inv.ok ? '=' : '≠'} e-money BDT ${tk(inv.liabilities, { web: 1, bare: 1 })}</div>
    ${idx.slice(0, 6).map((i) => { const j = E.S.journals[i]; return `<div class="jr"><div class="h"><b>${esc(j.id)} · ${esc(j.type)}</b><span class="muted">${new Date(j.ts + 6 * 3600000).toISOString().slice(5, 16).replace('T', ' ')}</span></div><table>${j.entries.map((e) => `<tr><td>${esc(nm(e.a))}</td><td class="n">${e.dr ? 'Dr ' + tk(e.dr, { web: 1, bare: 1 }) : ''}</td><td class="n">${e.cr ? 'Cr ' + tk(e.cr, { web: 1, bare: 1 }) : ''}</td></tr>`).join('')}</table><div class="muted" style="font-size:11.5px">hash ${esc(j.hash)}</div></div>`; }).join('')}</div>
    ${extra || ''}</aside>`;
}

    <div class="box"><h2>Exceptions</h2><p class="sub">Resolve each one; the decision is written to the audit log</p><div class="tw"><table class="t"><thead><tr><th>Ref</th><th>Counterparty</th><th>Issue</th><th class="n">Ledger</th><th class="n">Statement</th><th></th></tr></thead><tbody>${r.exc.map((x, i) => `<tr><td>${esc(x.ref)}</td><td>${x.cp}</td><td>${x.kind}</td><td class="n">${x.ledger == null ? '—' : tk(x.ledger, { web: 1 })}</td><td class="n">${x.external == null ? '—' : tk(x.external, { web: 1 })}</td><td>${x.done ? `<span class="badge">${esc(x.done)}</span>` : `<div class="flex"><button class="btn sm sec" data-act="resolveExc" data-arg="${i}|Biller confirmed late">Biller confirmed</button><button class="btn sm sec" data-act="resolveExc" data-arg="${i}|Refund raised">Refund member</button></div>`}</td></tr>`).join('')}</tbody></table></div></div>` : '<p class="muted mt">Not run yet today.</p>'}`;

    for (let k = 29; k >= 0; k--) { const d0 = t0 - k * DAY; days.push(new Date(d0 + 6 * 3600000).getUTCDate() + ''); fees.push(0); }

  }
  return '';
}
function runRecon() {
  const E = W.E; const d = W.meta.today; const items = (pred) => E.S.journals.filter((j) => E.dhakaDate(j.ts) === d && pred(j)).map((j) => ({ ref: j.id, amount: j.meta.amount }));
  const ek = items((j) => j.type === 'BILL' && j.meta.via === 'ekPay');
  const ext = ek.map((x) => Object.assign({}, x));
  if (ext.length > 2) { ext[0].amount += 5000; ext.splice(1, 1); }
  ext.push({ ref: 'EKP-' + d.replace(/-/g, '') + '-0917', amount: 72000 });
  const ekR = E.reconcile(ek, ext);
  const np = items((j) => j.type === 'NPSB_OUT'); const npR = E.reconcile(np, np);
  const rm = items((j) => j.type === 'REMITTANCE'); const rmR = E.reconcile(rm, rm);
  const fl = items((j) => j.type === 'FLOAT_TRANSFER' || j.type === 'CASH_IN' || j.type === 'CASH_OUT');
  app.web.recon = { rows: [{ name: 'Partner bank escrow', items: 1, matched: 1, exc: 0, cycle: 'T+0' }, { name: 'NPSB transfers', items: np.length, matched: npR.matched, exc: npR.exceptions.length, cycle: 'T+0' }, { name: 'ekPay billers', items: ek.length, matched: ekR.matched, exc: ekR.exceptions.length, cycle: 'T+1' }, { name: 'Remittance partners', items: rm.length, matched: rmR.matched, exc: 0, cycle: 'T+1' }, { name: 'Agent float', items: fl.length, matched: fl.length, exc: 0, cycle: 'Live' }], exc: ekR.exceptions.map((x) => Object.assign({ cp: 'ekPay' }, x)) };
  E.audit(USER.finance, 'RECON_RUN', { date: d, exceptions: ekR.exceptions.length });
}

function forecastPage(filt) {

  const n = hist.length; const xs = hist.map((_, i) => i); const mx = xs.reduce((s, x) => s + x, 0) / n, my = hist.reduce((s, y) => s + y, 0) / n;
  const slope = xs.reduce((s, x, i) => s + (x - mx) * (hist[i] - my), 0) / xs.reduce((s, x) => s + (x - mx) ** 2, 0); const icp = my - slope * mx;
  const fac = {}, cntd = {}; hist.forEach((y, i) => { const d = dowOf(i - 59); const tr = icp + slope * i; fac[d] = (fac[d] || 0) + y / Math.max(1, tr); cntd[d] = (cntd[d] || 0) + 1; }); for (const d in fac) fac[d] /= cntd[d];
  const res = hist.map((y, i) => y - (icp + slope * i) * fac[dowOf(i - 59)]); const sd = Math.sqrt(res.reduce((s, r) => s + r * r, 0) / (n - 2));
  const labels = [], actual = [], fc = [], band = [];
  for (let k = -59; k <= 30; k++) { const i = k + 59; labels.push(new Date(t0 + k * DAY + 6 * 3600000).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', timeZone: 'UTC' })); if (k < 0) { actual.push(hist[i]); fc.push(null); band.push(null); } else { const v = Math.max(0, (icp + slope * i) * fac[dowOf(k)]); actual.push(k === 0 ? (a.byDay[0] || 0) : null); fc.push(v); band.push([v - 1.96 * sd, v + 1.96 * sd]); } }
  const next30 = fc.filter((v) => v != null).reduce((s, v) => s + v, 0);
  return `<h1>30-day forecast</h1><p class="lead">Transactions are expected to total about ${grp(next30)} over the next 30 days, growing ${slope >= 0 ? '+' : ''}${slope.toFixed(1)} a day. Use it to plan agent float before peaks.</p>${filt}<div class="box"><h2>Daily transactions: last 60 days and next 30</h2><p class="sub">Method: linear trend × day-of-week factor; shaded band = ±1.96 × residual standard deviation (${sd.toFixed(1)} transactions)</p>${lineChart(labels, [{ name: 'Actual', values: actual, color: 'var(--chart-ink)' }, { name: 'Forecast', values: fc, color: 'var(--chart-fore)', dash: true }], { band, bandName: '95% range', title: 'Forecast' })}</div>`;
}

  const r = fn(el.dataset.arg, el); if (r !== 'noRender' && !(el.dataset.act === 'speak')) render();
});

  { t: 'The ask', clock: '14:45', star: 1, hi: null,
    say: 'SAJIDA\'s three decades of trust, in every member\'s pocket, with every taka backed, traced and protected. We propose a 90-day joint discovery and proof of concept on SAJIDA\'s own use cases, then a pilot in a few branches with success criteria we agree together.',
    do: 'Ask for: a sponsor and working team, 2 or 3 pilot branches, the brand guideline, MicroFin360 access, a view on the licence structure.',
    point: 'Then take questions.',
    go() { ACT.role('ho'); app.web.page = 'exec'; app.web.filter = { region: 'all', branch: 'all' }; } }
];
app.tour = null; // { i, short, min }
function tourSteps() { return app.tour && app.tour.short ? TOUR.filter((s) => s.star) : TOUR; }
function tourGo(i) { const st = tourSteps(); app.toast = null; app.tour.i = Math.max(0, Math.min(st.length - 1, i)); app.member.flow = null; app.member.ussd = null; app.modal = null; st[app.tour.i].go(); }
function tourPanel() {
  if (!app.tour) return '';
  const st = tourSteps(), s = st[app.tour.i], n = st.length, k = app.tour.i + 1;
  if (app.tour.min) return `<button class="tourpill" data-act="tourMin" aria-label="Show demo tour">▶ Demo tour · ${k}/${n}</button>`;
  return `<section class="tour" role="dialog" aria-label="Demo tour" aria-live="polite">
    <div class="th"><span>Step ${k} of ${n} · ${s.clock}</span><span class="flex" style="gap:4px"><button data-act="tourShort" aria-pressed="${!!app.tour.short}" title="Show only the 7-minute steps">${app.tour.short ? '7 min' : '15 min'}</button><button data-act="tourMin" aria-label="Minimise">–</button><button data-act="tourExit" aria-label="End tour">✕</button></span></div>
    <div class="tb"><h3>${esc(s.t)}</h3><p class="say">“${esc(s.say)}”</p><p><b>Do:</b> ${esc(s.do)}</p><p class="muted"><b>Point out:</b> ${esc(s.point)}</p></div>
    <div class="tf"><button class="btn sm sec" data-act="tourBack" ${k === 1 ? 'disabled' : ''}>Back</button><div class="dots">${st.map((_, j) => `<i class="${j === app.tour.i ? 'on' : ''}"></i>`).join('')}</div>${k < n ? '<button class="btn sm" data-act="tourNext">Next step</button>' : '<button class="btn sm" data-act="tourExit">Finish</button>'}</div></section>`;
}
function tourDecorate() {
  if (!app.tour || app.tour.min) return; const s = tourSteps()[app.tour.i]; if (!s.hi) return;
  const el = document.querySelector(s.hi); if (el) el.classList.add('pulse');
}
Object.assign(ACT, {
  tourStart: () => { boot(); app.tour = { i: 0, short: false, min: false }; tourGo(0); },
  tourNext: () => tourGo(app.tour.i + 1), tourBack: () => tourGo(app.tour.i - 1),
  tourExit: () => { app.tour = null; }, tourMin: () => { app.tour.min = !app.tour.min; },
  tourShort: () => { const cur = tourSteps()[app.tour.i]; app.tour.short = !app.tour.short; const st = tourSteps(); let j = st.indexOf(cur); if (j < 0) j = st.findIndex((x) => TOUR.indexOf(x) > TOUR.indexOf(cur)); tourGo(j < 0 ? st.length - 1 : j); }
});
document.addEventListener('keydown', (e) => {
  if (!app.tour || app.tour.min) return; const tag = (e.target.tagName || '').toLowerCase(); if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  if (e.key === 'ArrowRight') { ACT.tourNext(); render(); } else if (e.key === 'ArrowLeft') { ACT.tourBack(); render(); } else if (e.key === 'Escape') { ACT.tourMin(); render(); }
});


window.addEventListener('DOMContentLoaded', function () { try { boot(); } catch (e) { document.getElementById('root').innerHTML = '<pre style="padding:20px">' + (e && e.stack || e) + '</pre>'; } });
</script>
</body>
